name: Build Driver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Find WDK
        id: wdk
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $includeDirs = Get-ChildItem "$kitsRoot\Include" -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object Name -Descending
          $wdkVer = $includeDirs[0].Name
          Write-Host "WDK version: $wdkVer"
          "wdk_ver=$wdkVer" >> $env:GITHUB_OUTPUT

      - name: Build driver (km)
        shell: pwsh
        run: |
          $wdkVer = "${{ steps.wdk.outputs.wdk_ver }}"
          $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild km\km.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$wdkVer /m /v:minimal

      - name: List build output
        shell: pwsh
        run: |
          if (Test-Path build) { Get-ChildItem build -Recurse | Format-Table Name, Length }

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: codm-esp-driver
          path: |
            build/*.sys
            build/*.pdb
          if-no-files-found: warn

  build-um:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build um test
        shell: pwsh
        run: |
          $cl = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe"
          $vcvars = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" && cd um && cl /EHsc /std:c++17 /O2 /Fe:test_read.exe test_read.cpp /link"

      - name: Upload um test
        uses: actions/upload-artifact@v4
        with:
          name: codm-esp-um
          path: um/test_read.exe
          if-no-files-found: warn
