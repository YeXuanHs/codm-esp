#=============================================================================
#  .github/workflows/build-driver.yml
#
#  Builds codmdrv.sys with the Windows Driver Kit on a GitHub-hosted windows
#  runner, then uploads the signed-universal PE as a build artifact.
#
#  Why CI: the development host runs Win11 build 28000, which the WDK's
#  installer rejects ("当前 OS 版本不在支持的版本范围"), so ntddk.h and
#  ntoskrnl.lib are unavailable locally. The runner images ship a supported
#  SDK, and the resulting .sys is a plain PE that loads on 28000 -- a driver
#  binary is not bound to the build of the machine that compiled it.
#
#  Nothing proprietary is uploaded: this repository holds only our own source.
#=============================================================================
name: build-driver

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'driver/**'
      - 'common/**'
      - '.github/workflows/build-driver.yml'

jobs:
  build:
    name: WDK x64 release
    runs-on: windows-2022

    env:
      # Single source of truth for the kit version; every later step reads this.
      WDK_KIT: '10.0.26100.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdk = 'C:\Program Files (x86)\Windows Kits\10\Include'
          if (-not (Test-Path $wdk)) {
            Write-Host "WDK include dir missing, installing..."
            $installer = "$env:RUNNER_TEMP\wdksetup.exe"
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2289980' `
                              -OutFile $installer -UseBasicParsing
            & $installer /install /quiet /norestart `
                /features +vdmfxs +wdf +corewr +netwfx +wdf11 +wdf10 `
                           +kmdf +fltmgr +hidclass +ndis +netcfg `
                           +windowsdriverkitfull +debugtools
            if ($LASTEXITCODE -ne 0) { throw "WDK install failed: $LASTEXITCODE" }
          }
          Get-ChildItem $wdk | Select-Object -ExpandProperty Name

      - name: Locate WDK kit version
        id: kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Program Files (x86)\Windows Kits\10'
          # Prefer the pinned kit, but fall back to whatever WDK the runner
          # image actually provides (the image version can move).
          $wanted = $env:WDK_KIT
          $incRoot = Join-Path $root 'Include'
          $libRoot = Join-Path $root 'Lib'

          $kitName = $null
          $ordered = @($wanted) + @(
              Get-ChildItem $incRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Sort-Object { [version]$_.Name } -Descending |
              ForEach-Object { $_.Name })

          foreach ($k in $ordered) {
            if (-not $k) { continue }
            $hasHdr = Test-Path (Join-Path $incRoot "$k\km\ntddk.h")
            $hasLib = Test-Path (Join-Path $libRoot "$k\km\x64\ntoskrnl.lib")
            Write-Host "candidate $k : headers=$hasHdr libs=$hasLib"
            if ($hasHdr -and $hasLib) { $kitName = $k; break }
          }
          if (-not $kitName) {
            Write-Host "available include dirs:"
            Get-ChildItem $incRoot -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            throw 'no kit directory with both km\ntddk.h and km\x64\ntoskrnl.lib'
          }

          "version=$kitName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Add-Content -Path $env:GITHUB_ENV -Value "KIT_VERSION=$kitName"
          Write-Host "using kit $kitName"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = $env:KIT_VERSION
          if (-not $kit) { throw 'KIT_VERSION not set' }
          $kitsRoot = 'C:\Program Files (x86)\Windows Kits\10'

          $ntoskrnl = Join-Path $kitsRoot "Lib\$kit\km\x64\ntoskrnl.lib"
          $hal      = Join-Path $kitsRoot "Lib\$kit\km\x64\hal.lib"
          foreach ($lib in @($ntoskrnl, $hal)) {
            if (-not (Test-Path $lib)) {
              Write-Host "missing: $lib"
              Get-ChildItem (Split-Path $lib) | ForEach-Object { Write-Host "  $($_.Name)" }
              throw "import library missing: $lib"
            }
          }

          $kmDir     = Join-Path $kitsRoot "Include\$kit\km"
          $sharedDir = Join-Path $kitsRoot "Include\$kit\shared"
          foreach ($inc in @($kmDir, $sharedDir)) {
            if (-not (Test-Path $inc)) { throw "include dir missing: $inc" }
          }

          New-Item -ItemType Directory -Force -Path "$PWD\out" | Out-Null

          # Response files: PowerShell's native-argument handling can mangle
          # MSVC-style /flags, and these are the flags that actually matter
          # (/kernel for _KERNEL_MODE, /arch:x64 so ntdef.h sees _AMD64_).
          $cflags = Join-Path $PWD 'out\c.rsp'
          @(
            '/nologo', '/c', '/W0', '/kernel', '/arch:x64', '/GS-', '/Gs-', '/guard:cf-',
            "/I`"$kmDir`"", "/I`"$sharedDir`"", "/Fo`"$PWD\out\`""
          ) | Set-Content -Path $cflags -Encoding ascii

          $ldflags = Join-Path $PWD 'out\l.rsp'
          @(
            '/nologo', '/driver', '/subsystem:native', '/entry:DriverEntry', '/machine:x64',
            "/out:`"$PWD\out\codmdrv.sys`"",
            "/libpath:`"$(Join-Path $kitsRoot "Lib\$kit\km\x64")`"",
            "`"$PWD\out\driver.obj`"", "`"$PWD\out\pagewalk.obj`"",
            'ntoskrnl.lib', 'hal.lib'
          ) | Set-Content -Path $ldflags -Encoding ascii

          Write-Host "=== c.rsp ==="; Get-Content $cflags | ForEach-Object { Write-Host "  $_" }

          # Compile the macro probe so a target-architecture failure is
          # diagnosable from the log without a second round trip.
          Write-Host "=== arch macro probe ==="
          $probeRsp = Join-Path $PWD 'out\probe.rsp'
          @('/nologo', '/c', '/W0', '/kernel', '/arch:x64',
            "/Fo`"$PWD\out\probe.obj`"") | Set-Content -Path $probeRsp -Encoding ascii
          & cl.exe "@$probeRsp" driver\arch_probe.c 2>&1 |
              ForEach-Object { Write-Host "  probe: $_" }

          Write-Host "=== compiling ==="
          & cl.exe "@$cflags" driver\driver.c driver\pagewalk.c
          if ($LASTEXITCODE -ne 0) { throw "cl failed: $LASTEXITCODE" }

          Write-Host "=== linking ==="
          & link.exe "@$ldflags"
          if ($LASTEXITCODE -ne 0) { throw "link failed: $LASTEXITCODE" }

          Get-Item "$PWD\out\codmdrv.sys" | Select-Object Name, Length

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: codmdrv-sys
          path: out/codmdrv.sys
          if-no-files-found: error
